name: Build Copy Trader Linux

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux Artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copy-trader-v1.6.63
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: copy-trader-v1.6.63

      - name: Build release binary
        run: cargo build --locked --release --bin copy-trader

      - name: Prepare Linux binary artifact
        run: |
          mkdir -p dist
          cp target/release/copy-trader dist/copy-trader
          chmod +x dist/copy-trader

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: copy-trader-linux
          path: copy-trader-v1.6.63/dist/copy-trader
          if-no-files-found: error
          retention-days: 7